name: Claude-Rädchen APK bauen

on:
  push:
    paths:
      - "claude-usage-overlay/**"
      - ".github/workflows/claude-ring-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-usage-overlay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk ClaudeRing.apk

      - name: APK als Download speichern
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeRing-APK
          path: claude-usage-overlay/ClaudeRing.apk

      - name: APK als Release veröffentlichen (direkter Download fürs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: claude-ring-build-${{ github.run_number }}
          name: Claude-Rädchen (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Einfach ClaudeRing.apk auf dem Handy herunterladen und öffnen.
          files: claude-usage-overlay/ClaudeRing.apk
