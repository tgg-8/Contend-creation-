name: Schnarchwaechter APK

on:
  push:
    paths:
      - "schnarch-app/**"
      - ".github/workflows/schnarch-app.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a (pre)release for easy download on the phone

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: schnarch-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (detection logic)
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Check permissions (no INTERNET allowed)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "INTERNET permission found - not allowed"; exit 1
          fi
          "$BT/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -5
          ls -la app/build/outputs/apk/debug/

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Schnarchwaechter.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Schnarchwaechter-APK
          path: schnarch-app/Schnarchwaechter.apk
          retention-days: 30

      - name: Publish APK as release (direct download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: schnarchwaechter-build-${{ github.run_number }}
          name: Schnarchwächter (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Auf dem Handy Schnarchwaechter.apk herunterladen und öffnen.
            Anleitung: schnarch-app/README.md
          files: schnarch-app/Schnarchwaechter.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: schnarch-app/core/build/reports/tests/
          retention-days: 7
